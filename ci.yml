name: CI
on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - name: Validate frontend
        run: for f in frontend/js/*.js; do node -c "$f" || exit 1; done
