<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12" id="meta-theme">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WOD">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>Functional WOD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="sport-functional">

<!-- AUTH -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-box">
    <div class="auth-logo" id="auth-logo"></div>
    <h1 class="auth-title" id="auth-title">FUNCTIONAL WOD</h1>
    <p class="auth-version version-label">loading...</p>

    <!-- Sport selector -->
    <div class="auth-sport-selector">
      <label class="auth-sport-label">Select your sport</label>
      <div class="auth-sport-options" id="auth-sport-options">
        <button class="auth-sport-btn active" data-sport="functional">
          <span class="auth-sport-icon">&#9889;</span>
          <span>Functional</span>
        </button>
        <button class="auth-sport-btn" data-sport="swimming">
          <span class="auth-sport-icon">&#127946;</span>
          <span>Swimming</span>
        </button>
      </div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Login</button>
      <button class="auth-tab" data-tab="register">Register</button>
    </div>
    <div id="auth-error" class="auth-error hidden"></div>
    <div id="tab-login" class="auth-form">
      <input type="email" id="login-email" placeholder="Email" autocomplete="email">
      <input type="password" id="login-password" placeholder="Password">
      <button class="btn-primary" id="btn-login">Login</button>
      <button class="auth-link" id="btn-show-reset" type="button">Forgot password?</button>
    </div>
    <div id="tab-register" class="auth-form hidden">
      <input type="text" id="reg-name" placeholder="Your name">
      <input type="email" id="reg-email" placeholder="Email">
      <input type="password" id="reg-password" placeholder="Password (min 6 chars)">
      <button class="btn-primary" id="btn-register">Create account</button>
    </div>
    <div id="tab-reset" class="auth-form hidden">
      <input type="email" id="reset-email" placeholder="Your email" autocomplete="email">
      <input type="password" id="reset-password" placeholder="New password (min 6 chars)">
      <input type="password" id="reset-confirm" placeholder="Confirm new password">
      <button class="btn-primary" id="btn-reset">Reset Password</button>
      <button class="auth-link" id="btn-back-login" type="button">Back to login</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <nav class="nav">
    <div class="nav-brand">
      <span class="nav-logo" id="nav-logo"></span>
      <div>
        <span class="nav-title" id="nav-title">FUNCTIONAL WOD</span>
        <span class="nav-version version-label">...</span>
      </div>
    </div>
    <div class="nav-right">
      <div class="nav-user">
        <span class="nav-user-dot">&#9679;</span>
        <span id="nav-username">User</span>
      </div>
      <div class="nav-links">
        <button class="nav-btn active" data-view="today">Today</button>
        <button class="nav-btn" data-view="history">History</button>
        <button class="nav-btn" data-view="library">Library</button>
        <button class="nav-btn" data-view="settings">&#9881;</button>
        <button class="nav-btn nav-logout" id="btn-logout" title="Logout">&#8617;</button>
      </div>
    </div>
  </nav>

  <main class="main">
    <div id="view-today" class="view active">
      <div class="today-header">
        <div>
          <p class="eyebrow" id="today-date"></p>
          <h1 class="today-title" id="today-title">TODAY'S WOD</h1>
        </div>
        <div class="today-actions">
          <button class="btn-icon" id="btn-regenerate" title="Regenerate">&#8634;</button>
          <button class="btn-ai" id="btn-ai"><span class="ai-dot"></span> AI Variant</button>
        </div>
      </div>
      <div id="ai-status" class="ai-status hidden"></div>
      <div class="variant-tabs">
        <button class="vtab active" data-variant="1">Option 1</button>
        <button class="vtab" data-variant="2">Option 2</button>
        <button class="vtab" data-variant="3">Option 3</button>
      </div>
      <div id="workout-display" class="workout-display"><div class="loading-state"><div class="spinner"></div><p>Generating...</p></div></div>
      <div class="action-bar">
        <button class="btn-approve" id="btn-approve">Approve this workout</button>
        <p class="action-hint">Approved workouts are saved to history</p>
      </div>
    </div>

    <div id="view-history" class="view">
      <div class="view-header"><h2>History</h2><div id="history-stats" class="history-stats"></div></div>
      <div id="history-list" class="history-list"><div class="loading-state"><div class="spinner"></div></div></div>
      <div id="history-pagination" class="pagination"></div>
    </div>

    <div id="view-library" class="view">
      <div class="view-header">
        <h2>Exercise Library</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn-seed" id="btn-seed">Seed defaults</button>
          <button class="btn-upload-photo" id="btn-upload-photo">Upload Photo</button>
        </div>
      </div>
      <div id="photo-panel" class="photo-panel hidden">
        <p class="photo-hint">Upload a whiteboard photo for AI analysis</p>
        <div class="photo-drop" id="photo-drop">
          <input type="file" id="photo-input" accept="image/*" multiple style="display:none">
          <div class="photo-drop-inner" onclick="document.getElementById('photo-input').click()">
            <span class="photo-icon">&#128247;</span>
            <p>Click to select photos</p>
          </div>
        </div>
        <div id="photo-preview" class="photo-preview"></div>
        <button class="btn-analyze" id="btn-analyze" disabled>Analyze with AI</button>
        <div id="photo-results" class="photo-results hidden"></div>
      </div>
      <div class="library-add">
        <input type="text" id="ex-name" placeholder="Exercise name" autocomplete="off">
        <select id="ex-category">
          <option value="lower">Lower Body</option><option value="upper">Upper Body</option>
          <option value="core">Core</option><option value="conditioning">Conditioning</option><option value="power">Power</option>
        </select>
        <button class="btn-add" id="btn-add-ex">+ Add</button>
      </div>
      <div id="exercise-list" class="exercise-list"><div class="loading-state"><div class="spinner"></div></div></div>
    </div>

    <div id="view-settings" class="view">
      <div class="view-header"><h2>Settings</h2></div>
      <div class="settings-grid">
        <div class="settings-card">
          <h3>Workout Structure</h3>
          <label class="field"><span>Number of main blocks</span>
            <div class="block-count-selector">
              <button class="bc-btn" data-count="1">A</button>
              <button class="bc-btn active" data-count="2">A+B</button>
              <button class="bc-btn" data-count="3">A+B+C</button>
              <button class="bc-btn" data-count="4">A+B+C+D</button>
            </div>
          </label>
          <div id="block-modalities" class="block-modalities"></div>
        </div>
        <div class="settings-card">
          <h3>Anti-Repetition</h3>
          <label class="field">
            <span>Avoid repeating from last <strong id="days-label">7</strong> days</span>
            <input type="range" id="avoid-days" min="1" max="30" value="7" class="range-input">
            <div class="range-labels"><span>1 day</span><span>30 days</span></div>
          </label>
        </div>
        <div class="settings-card">
          <h3>Account</h3>
          <p class="card-hint" id="settings-user-info"></p>
          <button class="btn-save-settings" id="btn-save-settings">Save settings</button>
          <div id="settings-status" class="settings-status hidden"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-overlay" id="modal-overlay"></div>
  <div class="modal-box">
    <button class="modal-close" id="modal-close">&#10005;</button>
    <div id="modal-content"></div>
  </div>
</div>

<div id="toast" class="toast hidden">
  <span id="toast-icon" class="toast-icon"></span>
  <span id="toast-msg" class="toast-msg"></span>
</div>

<script src="/app.js"></script>
</body>
</html>
